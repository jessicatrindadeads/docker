services:
  api:
    build: .
    container_name: escola-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - escola_data:/data
    environment:
      DATABASE_URL: sqlite:////data/escola.db
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  escola_data:
